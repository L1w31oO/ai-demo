server.port=8080
spring.application.name=demo
logging.level.com.example.demo=DEBUG

# 默认模型 provider：ollama / deepseek / qwen / openai
chat.default-provider=ollama

# Ollama 本地大模型配置
ollama.base-url=http://localhost:11434
ollama.model-name=deepseek-r1:latest

# DeepSeek 远程 API（Key 获取：https://platform.deepseek.com）
# 支持环境变量 DEEPSEEK_API_KEY，或直接将 Key 写在等号后面
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.base-url=https://api.deepseek.com/v1
deepseek.model-name=deepseek-chat

# 通义千问远程 API（Key 获取：https://dashscope.console.aliyun.com，OpenAI 兼容模式）
# 支持环境变量 DASHSCOPE_API_KEY
qwen.api-key=${DASHSCOPE_API_KEY:}
qwen.base-url=https://dashscope.aliyuncs.com/compatible-mode/v1
qwen.model-name=qwen-plus

# OpenAI ChatGPT 远程 API（Key 获取：https://platform.openai.com）
# 支持环境变量 OPENAI_API_KEY
openai.api-key=${OPENAI_API_KEY:}
openai.base-url=https://api.openai.com/v1
openai.model-name=gpt-4o-mini
